[project]
name = "pxrr"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.24"
scipy = ">=1.10"
matplotlib = ">=3.7"
pandas = ">=2.0"
h5py = ">=3.8"
ipython = "*"
joblib = ">=1.3"
ruamel.yaml = ">=0.17"

[pypi-dependencies]
orsopy = ">=1.2"

# install local package editable
pxrr = { path = ".", editable = true }

# git dependency
xray-general-io = { git = "https://gitlab.desy.de/petra-iii/p08/data-process/xray_general_io.git" }

[feature.p08.pypi-dependencies]
p08-general = { git = "https://gitlab.desy.de/petra-iii/p08/data-process/p08_general.git" }

[tasks]
test = "pytest"
ipython = "ipython"