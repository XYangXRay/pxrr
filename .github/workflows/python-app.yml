# This workflow installs the project with pixi, runs lint (pre-commit) and tests.
# For more information see: https://pixi.sh/latest/integration/ci/github_actions/

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.8.1
      with:
        environments: dev
    - name: Lint with pre-commit
      run: pixi run -e dev lint
    - name: Test with pytest
      run: pixi run -e dev test
