name: Publish package on PyPI

# Publishes to PyPI when a pull request is merged into `main` (upstream) AND the
# merged PR bumped the release version in the `VERSION` file. On merge we create
# the matching `v<VERSION>` git tag (which hatch-vcs uses to derive the package
# version) and upload the built artifacts. If the tag already exists (the PR did
# not bump the version), the publish step is skipped.

on:
  pull_request:
    branches: [ "main" ]
    types: [ closed ]

permissions:
  contents: write  # needed to create and push the release tag

jobs:
  publish:
    # Only run for merged PRs, not for PRs that were closed without merging.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags so hatch-vcs can resolve the version

      - name: Read target version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; version was not bumped. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push release tag
        if: steps.check.outputs.should_publish == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Set up Python
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install build dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install hatch twine

      - name: Build package
        if: steps.check.outputs.should_publish == 'true'
        run: hatch build

      - name: Publish package to PyPI
        if: steps.check.outputs.should_publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
