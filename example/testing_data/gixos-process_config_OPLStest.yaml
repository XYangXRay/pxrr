# metadata.yaml
# data type: 2d gixs or 1d gixos
facility: "NSLS-II/12ID"
datatype: "1d gixos"
geometrical_correction: True

paths:
  gixs_path: "/Users/benocko/Library/CloudStorage/Dropbox/BNL/python/github/pxrr_chen/example/testing_data/CaCl2_data/"         
  path_out: "/Users/benocko/Library/CloudStorage/Dropbox/BNL/python/github/pxrr_chen/example/testing_data/output/"

measurements:
    sample:      "instrument"
    scan:        [46392, 46394, 46396, 46398, 46400]
    bkgsample:   "instrument"
    bkgscan:     [46393, 46395, 46397, 46399, 46401]
    flux:          2.7E11 # ct/s
    cttime_sample: 1 # seconds
    cttime_bkg:    1 # seconds

instrument:
    energy:   14400     # must
    alpha:  0.0728      # must
    Ddet:     640.0     # optional, for geometrical correction, footprint correction
    pixel:    0.172     # optional, for geometrical correction
    HWtth:    0.0486     # [deg] optional, mandatory for 1d gixs, half width of the GIXOS pixel in tth
    footprint: 10       # [mm] optional, for footprint correction

qxy0: [0.04, 0.06, 0.1, 0.15, 0.318]
DSpxHW:  3.5

PseudoR:
    qxy0_select_idx: [0,1,2,3]
    # resolution_mode 0: circular size [1/A], 1: slit, size [mm]
    resolution_mode: 1      #
    resolution_HW:  [0.33,0.5]  # mode=0: float, mode=1: [v_HW, h_HW]
    # the following are option, only relevant at slit resolution mode (resolution_mode = 1)
    energy: 14400            # [eV], None, or float
    Ddet: 1039.9              # [mm]
    bkg_mode: 0          # None, 0: phi (h) off, 1: beta (v) off
    bkg_off:  1          # [mm], center from specular

sample_params:
    Qc:       0.0218    # critical angle in 1/A
    tension:     0.050       # N/m
    temperature: 293        # K
    kappa: 1   # kbT
    amin: 5     # molecular distance

dependency:
    qz_selected: [0.1, 0.15, 0.35]
    kappa_deviation: 3
  
